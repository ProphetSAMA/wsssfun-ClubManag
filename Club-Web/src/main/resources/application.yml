server:
  port: 8888

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/club?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 与 ImageUploadController 里的 5MB 上限保持一致
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      update-strategy: not_empty

# JWT 配置：secret 必须通过环境变量提供（至少 32 字节），不放在仓库里
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# 图片上传路径
web:
  uploadpath: ${UPLOAD_PATH:D:/images/}
  load-path: file:${UPLOAD_PATH:D:/images/}
  # 允许跨域的前端地址，逗号分隔
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://localhost:8081}

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger - %msg%n'
